<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Misc | Huan Wang</title>
  <meta name="author" content="Huan Wang">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>">
  <script>(function () { try { var t = localStorage.getItem('theme'); if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } document.documentElement.setAttribute('data-theme', t); } catch (e) { } })();</script>
  <style>
    table {
      width: 100%;
    }

    li {
      margin-bottom: 2px;
    }
  </style>
</head>

<body>
  <button aria-label="Toggle dark / light theme" id="theme-toggle" title="Toggle theme" type="button"><span
      aria-hidden="true" class="ti-sun">☀️</span><span aria-hidden="true" class="ti-moon">🌙</span></button>
  <nav class="site-nav"><a href="index.html">Home</a><a href="publications.html">Publications</a><a
      href="blogs.html">Blogs</a><a href="talks.html">Talks</a><a href="teaching.html">Teaching</a><a
      href="services.html">Services</a><a href="misc.html" class="active">Misc</a>
  </nav>
  <table
    style="width:100%;max-width:900px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto">
    <tbody>
      <tr style="padding:0px">
        <td style="padding:0px">
          <table style="width:100%;border:0;border-spacing:0;border-collapse:separate;margin:0 auto;">
            <tbody>
              <tr>
                <td style="padding-top:14px;vertical-align:middle">
                  <heading>Misc</heading>
                  <p style="margin-top:1em;color:var(--fg-soft)">Photo Gallery</p>
                  <div class="photo-gallery" id="photo-gallery">
                    <button class="gallery-nav prev" type="button" aria-label="Previous photo">&#8249;</button>
                    <div class="gallery-track">
                      <figure class="gallery-slide">
                        <img src="images/24.6.3.jpg" alt="My first day at Westlake." loading="lazy" />
                        <figcaption>My first day at Westlake.</figcaption>
                      </figure>
                      <figure class="gallery-slide">
                        <img src="images/26.6.3_students_cvpr26.jpg" alt="My students attending CVPR26 in Denver."
                          loading="lazy" />
                        <figcaption>My students attending CVPR26 in Denver.</figcaption>
                      </figure>
                    </div>
                    <button class="gallery-nav next" type="button" aria-label="Next photo">&#8250;</button>
                    <div class="gallery-dots" aria-hidden="true"></div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
  <script>

    (function () {
      var docEl = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      function setTheme(t) { docEl.setAttribute('data-theme', t); try { localStorage.setItem('theme', t); } catch (e) { } }
      if (btn) {
        btn.addEventListener('click', function () {
          var cur = docEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; setTheme(cur);
        });
      }
    })();

    (function () {
      var g = document.getElementById('photo-gallery');
      if (!g) return;
      var track = g.querySelector('.gallery-track');
      var slides = Array.prototype.slice.call(track.querySelectorAll('.gallery-slide'));
      var prev = g.querySelector('.gallery-nav.prev');
      var next = g.querySelector('.gallery-nav.next');
      var dotsBox = g.querySelector('.gallery-dots');
      if (slides.length < 2) { if (prev) prev.style.display = 'none'; if (next) next.style.display = 'none'; }

      var dots = slides.map(function (s, i) {
        var d = document.createElement('button');
        d.type = 'button'; d.className = 'gallery-dot'; d.setAttribute('aria-label', 'Go to photo ' + (i + 1));
        d.addEventListener('click', function () { go(i); });
        dotsBox.appendChild(d); return d;
      });

      function current() {
        var w = track.clientWidth || 1;
        return Math.round(track.scrollLeft / w);
      }
      function go(i) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
      }
      function sync() {
        var i = current();
        dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
      }
      if (prev) prev.addEventListener('click', function () { go(current() - 1); });
      if (next) next.addEventListener('click', function () { go(current() + 1); });

      var raf;
      track.addEventListener('scroll', function () {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(sync);
      });
      window.addEventListener('resize', sync);
      sync();
    })();

  </script>
</body>

</html>
