  <script>

    (function () {
      var docEl = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      function setTheme(t) { docEl.setAttribute('data-theme', t); try { localStorage.setItem('theme', t); } catch (e) { } }
      if (btn) {
        btn.addEventListener('click', function () {
          var cur = docEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; setTheme(cur);
        });
      }
    })();
