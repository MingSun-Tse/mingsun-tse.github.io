[tool.black]
line-length = 264
skip-string-normalization = true
skip-magic-trailing-comma = true
exclude = '''
/(
    Experiments
    | Debug_Dir
)/
'''


[tool.isort]
profile = "black"                 # Ensures compatibility with Black formatter
line_length = 264                 # Match Black's line length
force_sort_within_sections = true # Alphabetically sorts imports within each section

# Define import sections (PEP 8 standard)
sections = [
    "FUTURE",    # `from __future__` imports (e.g., annotations)
    "STDLIB",    # Standard library imports (e.g., `os`, `sys`)
    "THIRDPARTY",# Third-party packages (e.g., `numpy`, `requests`)
    "FIRSTPARTY",# Local project imports (e.g., `from my_app import utils`)
    "LOCALFOLDER",# Relative imports (e.g., `from . import module`)
]

skip = ["Experiments", "Debug_Dir"]


[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.djlint]
profile = "html"  # or "html", "jinja", etc.
indent = 2
use_gitignore = true
max_line_length = 264